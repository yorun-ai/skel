name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  binaries:
    name: Release binaries
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GOWORK: 'off'
    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: true

      - name: Validate release and prepare notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release.sh prepare

      - name: Build archives
        run: |
          set -euo pipefail

          RELEASE_DIST="$RUNNER_TEMP/skelc-dist"
          echo "RELEASE_DIST=$RELEASE_DIST" >> "$GITHUB_ENV"
          version="${RELEASE_TAG#v}"
          revision="$(git rev-parse HEAD)"
          ldflags="-s -w -X go.yorun.ai/skel/internal/cli.ldModuleVersion=$RELEASE_TAG"
          mkdir -p "$RELEASE_DIST"

          for target in \
            darwin/amd64 \
            darwin/arm64 \
            linux/amd64 \
            linux/arm64
          do
            goos="${target%/*}"
            goarch="${target#*/}"
            archive="skelc_${version}_${goos}_${goarch}"
            stage="$RELEASE_DIST/$archive"

            if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
              echo "Release builds require a clean Git working tree"
              exit 1
            fi
            mkdir -p "$stage"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              GOMODCACHE="$RUNNER_TEMP/go-mod" \
              go build -trimpath -ldflags "$ldflags" \
                -o "$stage/skelc" ./cmd/skelc
            go version -m "$stage/skelc" | tee "$RUNNER_TEMP/skelc-build-info.txt"
            awk -v version="$RELEASE_TAG" -v revision="$revision" '
              $1 == "mod" && $2 == "go.yorun.ai/skel" && $3 == version { module_ok = 1 }
              $1 == "build" && $2 == "vcs.revision=" revision { revision_ok = 1 }
              $1 == "build" && $2 == "vcs.modified=false" { clean = 1 }
              END { exit !(module_ok && revision_ok && clean) }
            ' "$RUNNER_TEMP/skelc-build-info.txt" || {
              echo "Built skelc metadata does not match clean release $RELEASE_TAG at $revision"
              exit 1
            }
            cp LICENSE README.md "$stage/"
            tar -C "$RELEASE_DIST" -czf "$RELEASE_DIST/$archive.tar.gz" "$archive"
          done

          release_binary="$RELEASE_DIST/skelc_${version}_linux_amd64/skelc"
          actual_version="$("$release_binary" version | jq -er '.version')"
          if [[ "$actual_version" != "$RELEASE_TAG" ]]; then
            echo "Built skelc version $actual_version does not match release tag $RELEASE_TAG"
            exit 1
          fi

      - name: Create checksums
        run: |
          cd "$RELEASE_DIST"
          sha256sum skelc_*.tar.gz > checksums.txt

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release.sh publish
