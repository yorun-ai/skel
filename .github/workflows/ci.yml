name: CI

on:
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: '1.27.x'
  GOWORK: 'off'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-ci: ${{ steps.changes.outputs['run-ci'] }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha }}
          CHANGE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/ci.sh changes

  go-static:
    name: Go static
    needs: changes
    if: needs.changes.outputs['run-ci'] == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore Go build and test cache
        uses: ./.github/actions/go-cache
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check release automation
        run: |
          shellcheck .github/scripts/release*.sh
          bash .github/scripts/release_test.sh
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml

      - name: Run Go static checks
        run: bash .github/scripts/ci.sh static

  go-race:
    name: Go race
    needs: changes
    if: needs.changes.outputs['run-ci'] == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore Go race build and test cache
        uses: ./.github/actions/go-cache
        with:
          go-version: ${{ env.GO_VERSION }}
          mode: race

      - name: Test with race detector
        env:
          GORACE: atexit_sleep_ms=0
        run: go test -race -vet=off ./...

  examples:
    name: Examples
    needs: changes
    if: needs.changes.outputs['run-ci'] == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore Go build and test cache
        uses: ./.github/actions/go-cache
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Generate examples
        run: |
          quickstart_out="$RUNNER_TEMP/skelc-quickstart"
          commerce_out="$RUNNER_TEMP/skelc-commerce"

          ./examples/quickstart/generate.sh "$quickstart_out"
          ./examples/commerce/generate.sh "$commerce_out"
          go run ./cmd/skelc gen ts --api \
            --skel-in .github/typescript/versions.skel \
            --ts-out "$RUNNER_TEMP/skelc-versions/typescript"

      - name: Check generated TypeScript and versioned calls against the published runtime
        run: node .github/scripts/typecheck-generated.mjs "$RUNNER_TEMP/skelc-quickstart" "$RUNNER_TEMP/skelc-commerce" "$RUNNER_TEMP/skelc-versions"

  ci-checks:
    name: CI / Required Checks
    if: ${{ always() }}
    needs: [changes, go-static, go-race, examples]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify CI results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: bash .github/scripts/ci.sh verify
